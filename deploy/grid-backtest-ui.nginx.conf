# This host's requested HTTP route. Authentication covers page, assets and API.
limit_req_zone $binary_remote_addr zone=grid_backtest_ui:10m rate=10r/s;

server {
    listen 103.1.225.114:80 default_server;
    server_name 103.1.225.114;
    server_tokens off;
    client_max_body_size 16k;

    location = /module1/backtesting {
        return 308 /module1/backtesting/;
    }

    location ^~ /module1/backtesting/ {
        auth_basic "GRID backtesting";
        auth_basic_user_file /etc/nginx/auth/grid-backtesting.htpasswd;
        limit_req zone=grid_backtest_ui burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        return 404;
    }
}
